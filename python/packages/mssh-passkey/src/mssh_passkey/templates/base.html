<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}mssh-passkey{% endblock %}</title>

<!-- Bootstrap 5 via CDN. Air-gapped public-facing deployments
     vendor the two files into /static/ and swap the hrefs. -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet"
      href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<nav class="navbar bg-dark border-bottom">
  <div class="container-fluid">
    <span class="navbar-brand text-light">mssh-passkey</span>
  </div>
</nav>

<main class="container py-4" style="max-width: 600px;">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
