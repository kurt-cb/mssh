# mssh-admin — operator CLI + optional MCP server.
#
# Ships: mssh.admin.* (the CLI) and mssh.mcp.* (the Model Context
# Protocol server, behind the [mcp] extra so the heavyweight mcp SDK
# is opt-in).
#
# Depends on mssh-ca because `mssh-admin init` calls
# mssh.ca.cert_minter.bootstrap_ca to generate a fresh CA — that's
# the operator-side init path. Operator workstations typically install
# both anyway.

[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mssh-admin"
dynamic = ["version"]
description = "mssh — operator management CLI."
authors = [{name = "Kurt Godwin"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "mssh-common",
    "mssh-ca",
    "click>=8.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    # Renders the 2FA approve URL as a terminal QR code so the operator
    # can scan it with their phone instead of copy-pasting. Pure-Python,
    # ~50KB, no compiled deps. Used only by _handle_2fa_call in main.py.
    "qrcode>=7.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
# Flask admin portal (see design/future-ideas.md §26). The Flask dep
# is opt-in so the CLI install stays lean for operators who only use
# the terminal interface.
web = ["flask>=3.0"]

[project.scripts]
mssh-admin = "mssh.admin.main:cli"
# Exposes the CA's read-only admin API over MCP. Requires `pip install
# mssh-admin[mcp]`. §14.2.8.
mssh-mcp   = "mssh.mcp.server:main"
# Flask admin portal — operator-facing browser frontend over the CA's
# admin API (same surface as mssh-admin CLI). §14.2.7. Requires
# `pip install mssh-admin[web]`.
mssh-admin-web  = "mssh.admin.web_main:main"
# Deprecated alias: the binary was historically named msshd-admin-web,
# which mis-implies it manages msshd. It manages mssh-ca's admin API,
# so the canonical name is mssh-admin-web (§14.2.7). The alias is kept
# for one release so existing systemd units don't break; remove in v0.5.
msshd-admin-web = "mssh.admin.web_main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mssh*"]
namespaces = true

[tool.setuptools.package-data]
"mssh.admin.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.setuptools_scm]
root = "../../.."
fallback_version = "0.0.0+local"
