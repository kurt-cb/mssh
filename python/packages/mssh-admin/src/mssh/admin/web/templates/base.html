<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}mssh-admin{% endblock %} · mssh</title>

<!-- Bootstrap 5 via CDN. Air-gapped operators: vendor these two
     files into static/ and swap the hrefs. See design/future-ideas.md
     §26 for the deployment story. -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet"
      href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar py-3 vh-100 sticky-top border-end">
      <div class="px-3 pb-3 border-bottom mb-3">
        <h5 class="mb-0">mssh-admin</h5>
        <small class="text-muted">localhost portal</small>
      </div>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}"
             href="{{ url_for('mssh_admin_web.index') }}">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/users' %}active{% endif %}"
             href="{{ url_for('mssh_admin_web.users') }}">Users</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/groups' %}active{% endif %}"
             href="{{ url_for('mssh_admin_web.groups') }}">Groups</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/hosts' %}active{% endif %}"
             href="{{ url_for('mssh_admin_web.hosts') }}">Hosts</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/audit' %}active{% endif %}"
             href="{{ url_for('mssh_admin_web.audit') }}">Audit log</a>
        </li>
      </ul>
    </nav>

    <main class="col-md-9 col-lg-10 ms-sm-auto px-md-4 py-3">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
