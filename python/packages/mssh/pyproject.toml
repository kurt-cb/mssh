# mssh — the end-user client binary.
#
# Single module (mssh/client.py), one CLI entry point. Lightest of
# the four installables — operators ship this to user workstations
# only. No flask, no asyncssh.

[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "mssh"
dynamic = ["version"]
description = "mssh — CA-mediated SSH client."
authors = [{name = "Kurt Godwin"}]
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "mssh-common",
]

[project.scripts]
mssh = "mssh.client:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mssh*"]
namespaces = true

[tool.setuptools_scm]
# Computed for the wheel's metadata, but NO version_file — only
# mssh-common writes mssh/_version.py at build time. The others
# read it back at runtime via `from mssh._version import __version__`.
root = "../../.."
fallback_version = "0.0.0+local"
