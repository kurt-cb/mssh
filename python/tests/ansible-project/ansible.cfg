# Ansible config for the mssh adhoc lab.
#
# `inventory = hosts.ini` lets the operator run `ansible-playbook
# site.yml` without `-i`. The path is relative to ansible.cfg's
# directory, which is the same `ansible-project/` directory the test
# renders on the host AND pushes to the CA at /root/ansible-project/.
#
# The private key referenced by hosts.ini is also relative
# (./ansible_id_ed25519), so the same playbook tree runs identically
# from both contexts.

[defaults]
inventory          = hosts.ini
roles_path         = ./roles
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = default
result_format      = yaml
forks              = 10
deprecation_warnings = False

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
