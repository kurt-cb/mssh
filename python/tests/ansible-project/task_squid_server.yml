
---
- name: Setup Squid Proxy Server
  hosts: proxy_servers
  become: yes
  vars:
    squid_port: 3128
    allowed_network: "10.26.244.240/24"

  tasks:
    - name: Install Squid package
      ansible.builtin.package:
        name: squid
        state: present
      # Uses 'package' module to support both apt and yum/dnf

    - name: Deploy Squid configuration file
      ansible.builtin.template:
        src: templates/squid.conf.j2
        dest: /etc/squid/squid.conf
        owner: root
        group: root
        mode: '0644'
        validate: "squid -k parse -f %s"
      notify: restart squid
      # Validate check ensures the config is syntactically correct before applying

    - name: Ensure Squid service is started and enabled
      ansible.builtin.service:
        name: squid
        state: started
        enabled: yes

    - name: Allow Squid port in firewall (UFW for Ubuntu)
      ansible.builtin.ufw:
        rule: allow
        port: "{{ squid_port }}"
        proto: tcp
      when: ansible_os_family == "Debian"

  handlers:
    - name: restart squid
      ansible.builtin.service:
        name: squid
        state: restarted

