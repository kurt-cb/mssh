---
# Example: Spinup and configure Squid Proxy
# Usage: ansible-playbook examples/spinup_squid.yml

- name: Spinup Squid Proxy Host
  hosts: localhost
  gather_facts: no
  vars:
    proxy_static_ip: "10.26.244.2"
  roles:
    - role: lxc_spinup
      vars:
        container_name: squid-proxy
        image_name: mssh-alpine-fixed
        ssh_key_path: /home/kgodwin/msshtest/python/tests/ansible-project/ansible_id_ed25519
        inventory_file: /home/kgodwin/msshtest/python/tests/ansible-project/hosts.ini

- name: Configure Static IP
  hosts: squid-proxy
  gather_facts: yes
  vars:
    proxy_static_ip: "10.26.244.2"

  tasks:
    - name: Configure static IP with netplan
      ansible.builtin.copy:
        content: |
          network:
            version: 2
            ethernets:
              eth0:
                dhcp4: false
                addresses:
                  - {{ proxy_static_ip }}/24
                gateway4: 10.26.244.1
                nameservers:
                  addresses: [8.8.8.8, 8.8.4.4]
        dest: /etc/netplan/99-static.yaml
        owner: root
        group: root
        mode: '0644'
      register: netplan_config

    - name: Apply netplan configuration
      ansible.builtin.shell: netplan apply
      when: netplan_config.changed

    - name: Wait for network to settle
      pause:
        seconds: 2

- name: Configure Squid Proxy
  hosts: squid-proxy
  become: yes
  gather_facts: yes
  vars:
    proxy_static_ip: "10.26.244.100"
    squid_port: 3128
    allowed_network: "10.26.244.100/24"

  tasks:
    - name: Install Squid package
      ansible.builtin.package:
        name: squid
        state: present

    - name: Deploy Squid configuration file
      ansible.builtin.template:
        src: ../templates/squid.conf.j2
        dest: /etc/squid/squid.conf
        owner: root
        group: root
        mode: '0644'
        validate: "squid -k parse -f %s"
      notify: restart squid

    - name: Ensure Squid service is started and enabled
      ansible.builtin.service:
        name: squid
        state: started
        enabled: yes

    - name: Allow Squid port in firewall (UFW for Ubuntu)
      ansible.builtin.ufw:
        rule: allow
        port: "{{ squid_port }}"
        proto: tcp
      when: ansible_os_family == "Debian"

    - name: Check squid service status
      ansible.builtin.shell: systemctl is-active --quiet squid
      register: squid_status
      changed_when: false

    - name: Test proxy connectivity
      ansible.builtin.shell: |
        curl -s --proxy "http://{{ ansible_host }}:3128" -o /dev/null -w "%{http_code}" http://example.com
      register: proxy_test
      changed_when: false
      ignore_errors: yes

    - name: Display proxy test result
      debug:
        msg: "Proxy connectivity test returned: {{ proxy_test.stdout }}"

  handlers:
    - name: restart squid
      ansible.builtin.service:
        name: squid
        state: restarted

  post_tasks:
    - name: Display proxy setup instructions
      debug:
        msg: |
          Squid proxy is running at http://{{ ansible_host }}:3128

          To use the proxy in your shell:
            export http_proxy=http://{{ ansible_host }}:3128
            export https_proxy=http://{{ ansible_host }}:3128
