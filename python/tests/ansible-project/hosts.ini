# Ansible inventory — EXAMPLE / PLACEHOLDER.
#
# `_write_ansible_project()` in
# python/tests/lxc/test_setup_only_msshd.py overwrites this file at
# render time with one generated from the live lab's actual container
# names and bridged IPs. The version below is committed as a reference
# so an operator reading the template directory sees the expected
# shape without having to run the test first.
#
# Group layout the test renders:
#   - by OS:    ubuntu_servers / alpine_servers / fedora_servers / debian
#   - by role:  ca_server / sales / accounting / hr / engineering
#
# Lab prefix is `mssh` by default (overridable via `--lxc-prefix`),
# so containers are named mssh-adhoc-{ca,acct,sales,hr,eng}. Set
# `--lxc-prefix foo` for a parallel lab and you'll get foo-adhoc-*.

[fedora_servers]

[ubuntu_servers]
mssh-adhoc-ca    ansible_host=10.0.0.1
mssh-adhoc-acct  ansible_host=10.0.0.10
mssh-adhoc-sales ansible_host=10.0.0.11
mssh-adhoc-hr    ansible_host=10.0.0.12

[alpine_servers]
mssh-adhoc-eng   ansible_host=10.0.0.13

[debian]

[ca_server]
mssh-adhoc-ca    ansible_host=10.0.0.1

[sales]
mssh-adhoc-sales ansible_host=10.0.0.11

[accounting]
mssh-adhoc-acct  ansible_host=10.0.0.10

[hr]
mssh-adhoc-hr    ansible_host=10.0.0.12

[engineering]
mssh-adhoc-eng   ansible_host=10.0.0.13

[proxy_servers]
squid-proxy  ansible_host=10.26.244.2


# Convenience parent group used by site.yml. By default every lab
# container (servers + CA) is a "proxy client" — adjust to taste.
[proxy_clients:children]
ubuntu_servers
alpine_servers
debian
fedora_servers

[all:vars]
ansible_user=root
# Relative to this hosts.ini's directory — works on the host
# (./ansible-project/ansible_id_ed25519) and on the CA
# (/root/ansible-project/ansible_id_ed25519) without per-context
# overrides.
ansible_ssh_private_key_file=./ansible_id_ed25519
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_python_interpreter=/usr/bin/python3

# Lab prefix: mssh (overridden by --lxc-prefix)
